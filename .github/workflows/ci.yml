name: Scaffold checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scaffold:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install validation tools
        # Historical replay entry points import the OpenCV image/GT helpers.
        # Match the declared core dependency so fresh-process tests see a real environment.
        run: python -m pip install "pytest>=8,<10" "ruff>=0.11,<1" "build>=1,<2" "numpy>=2,<3" "pillow>=10,<13" "opencv-python-headless>=4.10,<5" "scipy>=1.14,<2"
      - name: Lint
        run: python -m ruff check .
      - name: Isolated entry points
        run: python scripts/check_scaffold.py
      - name: Core boundary tests
        run: python -m pytest reconstruction/tests
      - name: Camera and sampling diagnostics
        run: python -m unittest discover -s tests -p test_native_diagnostics.py -v
      - name: Straight-line geometry controls
        run: python -m unittest discover -s tests -p test_line_controls.py -v
      - name: Common point and curve readout controls
        run: python -m unittest discover -s tests -p "test_common_readout*.py" -v
      - name: RGB observation and local evidence controls
        run: |
          python -m unittest discover -s tests -p test_rod_observations.py -v
          python -m unittest discover -s tests -p test_rod_evidence*.py -v
          python -m unittest discover -s tests -p test_camera_background.py -v
          python -m unittest discover -s tests -p test_camera_all_view_validation.py -v
          python -m unittest discover -s tests -p test_camera_training_groups.py -v
          python -m unittest discover -s tests -p test_camera_training_audit.py -v
          python -m unittest discover -s tests -p test_camera_native_sensitivity.py -v
          python -m unittest discover -s tests -p test_camera_envelope_challenges.py -v
          python -m unittest discover -s tests -p "test_rod_camera_envelope*.py" -v
          python -m unittest discover -s tests -p "test_camera_bundle*.py" -v
          python -m unittest discover -s tests -p test_camera_point_snapshot.py -v
          python -m unittest discover -s tests -p test_heldout_metrics.py -v
      - name: Photometric and correspondence controls
        # Headless OpenCV also enables correspondence checks in the clean CI environment.
        # The installed DA3 environment separately covers NumPy 1.26 compatibility.
        run: |
          python -m unittest discover -s tests -p test_rod_geometry_audit.py -v
          python -m unittest discover -s tests -p test_rod_profile_controls.py -v
          python -m unittest discover -s tests -p test_rod_multiview*.py -v
          python -m unittest discover -s tests -p test_rod_identity*.py -v
          python -m unittest discover -s tests -p test_rod_reference*.py -v
          python -m unittest discover -s tests -p test_rod_height*.py -v
          python -m unittest discover -s tests -p test_rod_candidate*.py -v
          python -m unittest discover -s tests -p test_background_correspondences.py -v
          python -m unittest discover -s tests -p "test_correspondence*.py" -v
          python -m unittest discover -s tests -p test_track_image_controls.py -v
      - name: Build Python distributions
        run: |
          python -m build reconstruction
          python -m build backends/da3
          python -m build experiments
      - name: Package Blender add-on
        run: python scripts/build_addon.py

name: Scaffold checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scaffold:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install validation tools
        run: python -m pip install "pytest>=8,<10" "ruff>=0.11,<1" "build>=1,<2"
      - name: Lint
        run: python -m ruff check .
      - name: Isolated entry points
        run: python scripts/check_scaffold.py
      - name: Core boundary tests
        run: python -m pytest reconstruction/tests
      - name: Build Python distributions
        run: |
          python -m build reconstruction
          python -m build backends/da3
          python -m build experiments
      - name: Package Blender add-on
        run: python scripts/build_addon.py

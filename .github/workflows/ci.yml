name: Scaffold checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scaffold:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install validation tools
        run: python -m pip install "pytest>=8,<10" "ruff>=0.11,<1" "build>=1,<2" "numpy>=2,<3" "pillow>=10,<13"
      - name: Lint
        run: python -m ruff check .
      - name: Isolated entry points
        run: python scripts/check_scaffold.py
      - name: Core boundary tests
        run: python -m pytest reconstruction/tests
      - name: Camera and sampling diagnostics
        run: python -m unittest discover -s tests -p test_native_diagnostics.py -v
      - name: Straight-line geometry controls
        run: python -m unittest discover -s tests -p test_line_controls.py -v
      - name: RGB observation and local evidence controls
        run: |
          python -m unittest discover -s tests -p test_rod_observations.py -v
          python -m unittest discover -s tests -p test_rod_evidence*.py -v
          python -m unittest discover -s tests -p test_camera_background.py -v
          python -m unittest discover -s tests -p test_heldout_metrics.py -v
      - name: Photometric and correspondence controls
        # The OpenCV-specific correspondence checks also run in the local DA3 environment.
        # NumPy-only CI still checks split isolation, geometry and missing-data semantics.
        run: |
          python -m unittest discover -s tests -p test_rod_geometry_audit.py -v
          python -m unittest discover -s tests -p test_rod_profile_controls.py -v
          python -m unittest discover -s tests -p test_rod_multiview*.py -v
          python -m unittest discover -s tests -p test_rod_identity*.py -v
          python -m unittest discover -s tests -p test_background_correspondences.py -v
      - name: Build Python distributions
        run: |
          python -m build reconstruction
          python -m build backends/da3
          python -m build experiments
      - name: Package Blender add-on
        run: python scripts/build_addon.py
